name: CI
# Once per change: on its pull request, and on main after the merge (a push to a branch alone runs nothing; open the PR).
# Editing the pull request's description runs it again: the rules job checks that the description says what the change
# reaches and what was not checked (tools/check-git.mjs).
# Five jobs side by side; `CI passed` waits for all of them and is the one check main's branch rule requires.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: no job here writes to the repository, so none can be made to.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Rules (names, migrations, product name)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: node tools/check-git.mjs --base origin/main
        if: github.event_name == 'pull_request'
      - run: node tools/check-name.mjs
      - run: node tools/check-migrations.mjs origin/main

  platform:
    name: Platform (build, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # Turbo's cache: packages whose files did not change since the last run skip their build, typecheck and tests.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: CONSOLE_BASE=/console/ pnpm exec turbo run build --cache-dir=.turbo/cache
      # Every shared English text (labels, errors, form checks) is in the catalogue languages are translated from.
      - run: node tools/i18n-text.mjs --check
      - run: pnpm exec turbo run typecheck --cache-dir=.turbo/cache --output-logs=errors-only
      # One package's tests at a time; each runs its own files in parallel (all at once timed tests out on four cores).
      - run: pnpm exec turbo run test --cache-dir=.turbo/cache --concurrency=1 --output-logs=errors-only

  flutter:
    name: Flutter app (analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos lib test
      # The app's tests read a real school: the server, with Sunrise Valley moved in from its files.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start the database and the server, and move Sunrise Valley in from its files
        run: bash tools/dev-reset.sh
      - run: node tools/dataset/app-sessions.mjs
      - run: flutter test
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-test-logs
          path: /tmp/*.log

  # The browser checks run against the built admin and console the server serves, as on Render (not Vite's dev servers,
  # which compile each page on first visit and sent no Content-Security-Policy, so a blocked font never showed).
  flows:
    name: Browser flows (admin, console)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The host the server names in its own links (API_BASE_URL), so files it serves, like student photos, are its own origin.
      ADMIN: http://localhost:4000
      CONSOLE: http://localhost:4000/console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: CONSOLE_BASE=/console/ pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the database and the server, and move Sunrise Valley in from its files
        run: bash tools/dev-reset.sh
      - name: The server serves the built admin and console
        run: for u in / /s/sunrise-valley /console/ /console/schools /theme.js /console/theme.js; do curl -sf -o /dev/null http://127.0.0.1:4000$u || { echo "GET $u failed"; tail -20 /tmp/server.log; exit 1; }; done
      - run: node tools/e2e-flows.mjs /tmp/e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flow-failures
          path: |
            /tmp/e2e
            /tmp/*.log

  pages:
    name: Every page (four widths, light and dark)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The host the server names in its own links (API_BASE_URL), so files it serves, like student photos, are its own origin.
      ADMIN: http://localhost:4000
      CONSOLE: http://localhost:4000/console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: CONSOLE_BASE=/console/ pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the database and the server, and move Sunrise Valley in from its files
        run: bash tools/dev-reset.sh
      - run: node tools/check-pages.mjs --full --workers 4
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: page-failures
          path: /tmp/*.log

  passed:
    name: CI passed
    if: always()
    needs: [rules, platform, flutter, flows, pages]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: echo "A check failed or was cancelled; see the jobs above." && exit 1
      - run: echo "Every check passed."
