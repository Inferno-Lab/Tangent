name: tangent
description: Tangent — a school app for students, parents, and teachers.
publish_to: 'none'
version: 2.0.6+216

environment:
  sdk: ^3.11.5

dependencies:
  cached_network_image: ^3.4.1
  camera: ^0.12.0+2
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  # Flutter's own words and right-to-left layout for every language (part of the SDK).
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 9.2.4
  geolocator: ^14.0.1
  get: ^4.7.2
  get_storage: ^2.1.1
  image_picker: ^1.2.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  # Vendored: 2.1.0 on pub extends IconData, which is final on this Flutter.
  phosphor_flutter:
    path: packages/phosphor_flutter
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.7.1
  flutter_test:
    sdk: flutter
  json_serializable: ^6.11.1
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    # The app's words in each language (the built-in English is in lib/core/translations).
    - assets/i18n/
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: AnekDevanagari
      fonts:
        - asset: assets/fonts/AnekDevanagari.ttf
    # Arabic and Urdu (SIL Open Font License); other scripts' Noto fonts come from the school's server on first use.
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic_400Regular.ttf
        - asset: assets/fonts/NotoSansArabic_700Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
